name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: sudo apt-get update && sudo apt-get install -y libmagic1

      - run: pip install -e ".[dev]" build twine ruff

      - run: ruff check wa_mcp tests --select F,E9

      - run: pytest -q

      - name: The tag and the version in pyproject must agree
        id: version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag v$tag does not match pyproject version $version" >&2
              exit 1
            fi
          fi

      - run: python -m build

      - run: twine check dist/*

      - name: Install the wheel somewhere clean and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import wa_mcp, wa_mcp.app"
          /tmp/clean/bin/personal-whatsapp-mcp --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Publishing to PyPI is opt-in. It runs only once the `pypi` environment
  # exists in the repository settings, so a fork or a first tag cannot publish
  # by accident. Set it up with Trusted Publishing rather than an API token:
  # PyPI -> your project -> Publishing -> add a GitHub publisher for this repo
  # and the `pypi` environment. Nothing then needs to be stored as a secret.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
