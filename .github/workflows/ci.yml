name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - run: pip install -e ".[dev]" ruff

      - run: ruff check wa_mcp tests --select F,E9

      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Import from a clean install
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import wa_mcp, wa_mcp.app"
          /tmp/clean/bin/suprai-whatsapp-mcp --help > /dev/null
