[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suprai-whatsapp-mcp"
version = "0.2.0"
description = "WhatsApp for any LLM: an MCP server, a web UI, and a configurable auto-reply — one number, one process."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Everything needed for a working install. No Redis, no database server:
# SQLite is the default and ships with Python.
dependencies = [
    "fastmcp>=3.4,<4",
    "neonize>=0.4.3",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "segno>=1.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mongo    = ["motor>=3.4"]
dev      = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "asgi-lifespan>=2.1",
            "asyncpg>=0.29", "motor>=3.4"]

[project.scripts]
suprai-whatsapp-mcp = "wa_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wa_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
