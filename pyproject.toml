[build-system]
# 77 is the first with PEP 639 license expressions.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suprai-whatsapp-mcp"
version = "0.2.0"
description = "WhatsApp for any LLM: an MCP server, a web UI, and a configurable auto-reply — one number, one process."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SuprAI" }]
keywords = ["whatsapp", "mcp", "model context protocol", "llm", "agent",
            "chatbot", "auto-reply", "whatsmeow", "neonize"]

# Read on PyPI before anyone reads the README: what it is, who it is for, and
# which Pythons it will actually install on.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]


# Everything needed for a working install. No Redis, no database server:
# SQLite is the default and ships with Python.
dependencies = [
    "fastmcp>=3.4,<4",
    "neonize>=0.4.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "segno>=1.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage      = "https://github.com/suprai/whatsapp-mcp"
Repository    = "https://github.com/suprai/whatsapp-mcp"
Documentation = "https://github.com/suprai/whatsapp-mcp/tree/main/docs"
Changelog     = "https://github.com/suprai/whatsapp-mcp/blob/main/CHANGELOG.md"
Issues        = "https://github.com/suprai/whatsapp-mcp/issues"

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mongo    = ["motor>=3.4"]
dev      = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "asgi-lifespan>=2.1",
            "asyncpg>=0.29", "motor>=3.4"]

[project.scripts]
suprai-whatsapp-mcp = "wa_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wa_mcp*"]

# Without this the marker is not installed, and the Typing :: Typed classifier
# is a claim type checkers cannot act on.
[tool.setuptools.package-data]
wa_mcp = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Importing a pytest fixture and then naming a parameter after it is how
# fixtures are shared between test modules; ruff reads it as a redefinition.
"tests/*" = ["F811"]
