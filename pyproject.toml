[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-whatsapp-mcp"
version = "0.2.0"
description = "Self-hosted WhatsApp MCP server: connect your personal WhatsApp number to Claude, ChatGPT or any LLM, with a web UI and configurable auto-reply."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Divi Gnanesh", email = "divignanesh@gmail.com" },
    { name = "Tejeshwar Reddy", email = "tejeshwarreddy25@gmail.com" },
    { name = "Guddanti Jyotish Kumarr", email = "jyotishk359@gmail.com" },
    { name = "Affaan Jaweed", email = "deadlyplatinum@gmail.com" },
    { name = "Yangala Vamsi Krishna", email = "vamsikrishna8595@gmail.com" },
]
keywords = ["whatsapp", "mcp", "mcp-server", "model context protocol", "llm",
            "claude", "chatgpt", "openai", "agent", "chatbot", "auto-reply",
            "whatsapp-bot", "whatsapp-api", "whatsapp-automation", "self-hosted",
            "whatsmeow", "neonize"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp>=3.4,<4",
    "neonize>=0.4.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "starlette>=0.37",
    "mcp>=1.2",
    "segno>=1.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage      = "https://github.com/Gnaneshdivi/personal-whatsapp-mcp"
Repository    = "https://github.com/Gnaneshdivi/personal-whatsapp-mcp"
Documentation = "https://github.com/Gnaneshdivi/personal-whatsapp-mcp/tree/main/docs"
Changelog     = "https://github.com/Gnaneshdivi/personal-whatsapp-mcp/blob/main/CHANGELOG.md"
Issues        = "https://github.com/Gnaneshdivi/personal-whatsapp-mcp/issues"

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mongo    = ["motor>=3.4"]
dev      = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "asgi-lifespan>=2.1",
            "asyncpg>=0.29", "motor>=3.4"]

[project.scripts]
personal-whatsapp-mcp = "wa_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wa_mcp*"]

[tool.setuptools.package-data]
wa_mcp = ["py.typed", "static/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]
